    <script>
      (function () {
        try {
          const base = "onesTheme";
          let theme = localStorage.getItem(base + ":store:last");
          if (theme !== "dark" && theme !== "light") {
            for (let i = 0; i < localStorage.length; i += 1) {
              const key = localStorage.key(i);
              if (!key || key.indexOf(base + ":customer:") !== 0) continue;
              theme = localStorage.getItem(key);
              if (theme === "dark" || theme === "light") break;
            }
          }
          if (theme === "dark" || theme === "light") document.documentElement.dataset.theme = theme;
        } catch (error) {}
      })();
    </script>
    <script>
      (function () {
        try {
          const count = Number(localStorage.getItem("onesCartCountPreview") || 0);
          if (!count) return;
          window.__onesCartPreview = count;
        } catch (error) {}
      })();
    </script>
