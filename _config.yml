# GitHub Pages is a static preview only; never publish PHP/source/backups/tests.
# Jekyll include entries also match literal prefixes. A bracket in each filename
# makes fnmatch exact while preventing e.g. api-client.js.bak from matching it.
include:
  - '[i]ndex.html'
  - '[a]dmin.html'
  - '[b]log.html'
  - '[c]art.html'
  - '[l]ogin.html'
  - '[p]rivacy.html'
  - '[p]roduct.html'
  - '[p]rofile.html'
  - '[t]erms.html'
  - '[v]erify.html'
  - '[a]dmin.js'
  - '[a]pi-client.js'
  - '[a]pp.js'
  - '[b]log.js'
  - '[c]art.js'
  - '[c]ms-focus.js'
  - '[l]ogin.js'
  - '[p]roduct.js'
  - '[p]rofile.js'
  - '[p]rofile-orders.js'
  - '[s]torage.js'
  - '[t]heme.js'
  - '[v]erify.js'
  - '[s]tyles.css'
  - '[a]dmin.css'
  - '[c]ms-relations.css'
  - '[a]dmin-feedback.css'
  - '[a]dmin-responsive.css'
  - '[v]erify.css'
  - '[r]obots.txt'
  - '[a]ssets'
  # Jekyll filters each directory by entry basename, not its full relative path.
  # Explicit asset basenames also avoid accidentally including backup suffixes.
  - '[v]endor'
  - '[p]urify-3.4.16.min.js'
  - '[o]nes-logo.webp'
  - '[h]ero-f3-promax-platform-light.webp'
  - '[h]ero-f3-promax-platform-light.png'
  - '[h]ero-f3-promax-platform-dark-v2.webp'
  - '[h]ero-f3-promax-platform-dark-v2.png'
  - '[f]avicon.svg'
  - '[f]3-promax-hero.png'
  - '[f]3-promax-cutout.png'
  - '[f]3-lineup-mobile.webp'
  - '[f]3-lineup-hero.webp'
  - '[f]3-lineup-hero.png'
exclude:
  - '*'
  - '**/*'
