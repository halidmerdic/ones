# GitHub Pages is a static preview only; never publish PHP/source/backups/tests.
# Jekyll include entries also match literal prefixes. A bracket in each filename
# makes fnmatch exact while preventing e.g. api-client.js.bak from matching it.
include:
  - '[i]ndex.html'
  - '[a]dmin.html'
  - '[b]log.html'
  - '[c]art.html'
  - '[l]ogin.html'
  - '[p]rivacy.html'
  - '[p]roduct.html'
  - '[p]rofile.html'
  - '[t]erms.html'
  - '[v]erify.html'
  - '[a]dmin.js'
  - '[a]pi-client.js'
  - '[a]pp.js'
  - '[b]log.js'
  - '[c]art.js'
  - '[c]ms-focus.js'
  - '[l]ogin.js'
  - '[p]roduct.js'
  - '[p]rofile.js'
  - '[p]rofile-orders.js'
  - '[s]torage.js'
  - '[t]heme.js'
  - '[v]erify.js'
  - '[s]tyles.css'
  - '[a]dmin.css'
  - '[c]ms-relations.css'
  - '[a]dmin-feedback.css'
  - '[a]dmin-responsive.css'
  - '[v]erify.css'
  - '[r]obots.txt'
  - '[a]ssets'
  - 'assets/**'
exclude:
  - '*'
  - '**/*'
