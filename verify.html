<!doctype html>
<html lang="bs">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Potvrda email adrese | oneS</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="verify.css?v=20261005-security-4" />
  </head>
  <body>
    <main class="verification-page">
      <section class="verification-card" aria-labelledby="verificationTitle">
        <a href="index.html" class="eyebrow">oneS</a>
        <h1 id="verificationTitle">Potvrda email adrese</h1>
        <p id="verificationHelp">Link vrijedi 30 minuta. Potvrda se izvršava tek pritiskom na dugme.</p>
        <form id="verificationForm">
          <label id="verificationPasswordField">
            Odaberite lozinku za novi profil
            <input id="verificationPassword" type="password" autocomplete="new-password" aria-describedby="passwordHelp" />
            <span id="passwordHelp">Najmanje 15 znakova, najviše 72 UTF-8 bajta. Naša slova i emoji zauzimaju više bajtova.</span>
          </label>
          <button class="btn btn-primary" id="verifyEmailBtn" type="submit">Potvrdi email adresu</button>
          <p id="verificationStatus" role="status" aria-live="polite"></p>
        </form>
        <p id="verificationLogin" hidden>Za postojeći profil potrebna je prijava. <a href="login.html" target="_blank" rel="noopener noreferrer">Prijavite se u drugoj kartici</a>, zatim ovdje ponovo pritisnite Potvrdi.</p>
        <a id="verificationContinue" href="profile.html" hidden>Otvori profil</a>
        <p><a href="login.html">Registracija ili novi link</a></p>
      </section>
    </main>
    <script src="theme.js?v=20260803-load-1"></script>
    <script src="api-client.js?v=20261005-security-5"></script>
    <script src="verify.js?v=20261005-security-4"></script>
  </body>
</html>
