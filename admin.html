<!doctype html>
<html lang="bs">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="storage.js?v=20261005-security-10"></script>
    <title>oneS CMS</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#111216" />
    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg?v=20260808-1" />
    <link rel="stylesheet" href="styles.css?v=20260903-ui-1" />
    <link rel="stylesheet" href="admin.css?v=20260903-ui-1" />
    <link rel="stylesheet" href="cms-relations.css?v=20261005-security-7" />
    <link rel="stylesheet" href="admin-feedback.css?v=20261005-security-8" />
    <link rel="stylesheet" href="admin-responsive.css?v=20261005-security-11" />
  </head>
  <body class="admin-body cms-page">
    <button class="admin-menu-toggle" type="button" id="adminMenuToggle" aria-label="Otvori CMS meni" aria-controls="adminSidebar" aria-expanded="false">
      <span></span>
      <span></span>
      <span></span>
    </button>
    <div class="admin-menu-backdrop" id="adminMenuBackdrop" hidden></div>
    <main class="admin-shell">
      <aside class="admin-sidebar" id="adminSidebar" aria-labelledby="adminMenuTitle" inert aria-hidden="true">
        <div class="admin-sidebar-head">
          <span id="adminMenuTitle">CMS meni</span>
          <button type="button" id="adminMenuClose" aria-label="Zatvori CMS meni">&times;</button>
        </div>
        <a class="brand" href="/" aria-label="oneS stranica">
          <img src="assets/ones-logo.webp" alt="oneS logo" />
        </a>
        <nav class="admin-nav" id="adminNav" aria-label="CMS sekcije"></nav>
        <a class="btn btn-secondary" href="/">Pogledaj stranicu</a>
      </aside>

      <section class="admin-main">
        <div class="admin-topbar">
          <div>
            <p class="eyebrow">oneS CMS</p>
            <h1>Upravljanje sadržajem</h1>
            <p>Sačuvane izmjene se prikazuju na javnoj stranici nakon osvježavanja.</p>
          </div>
          <div class="admin-actions">
            <input id="restoreBackupInput" type="file" accept="application/json,.json" hidden />
            <button class="theme-toggle" type="button" data-theme-toggle aria-label="Prebaci na tamni mod" title="Prebaci na tamni mod" aria-pressed="false"><span aria-hidden="true">◐</span></button>
            <button class="btn btn-primary" type="button" id="saveBtn">Sačuvaj CMS</button>
          </div>
        </div>

        <section class="cms-validation-banner" id="cmsValidationBanner" role="alert" aria-live="assertive" hidden></section>

        <form class="login-panel" id="loginPanel" hidden>
          <h2>Admin prijava</h2>
          <p>Prijavite se za upravljanje proizvodima, sadržajem i upitima kupaca.</p>
          <label>
            Lozinka
            <span class="password-field">
              <input id="passwordInput" type="password" autocomplete="current-password" maxlength="72" placeholder="Unesite lozinku" required />
              <button type="button" class="password-toggle" data-password-toggle="passwordInput" aria-label="Prikazi lozinku">Vidi</button>
            </span>
          </label>
          <button class="btn btn-primary" type="submit" id="loginBtn">Prijava</button>
        </form>

        <div class="admin-editor" id="adminEditor" hidden>
          <section class="admin-panel" data-panel="settings"></section>
          <section class="admin-panel" data-panel="sections" hidden></section>
          <section class="admin-panel" data-panel="categories" hidden></section>
          <section class="admin-panel" data-panel="badges" hidden></section>
          <section class="admin-panel" data-panel="products" hidden></section>
          <section class="admin-panel" data-panel="orders" hidden></section>
          <section class="admin-panel" data-panel="customers" hidden></section>
          <section class="admin-panel" data-panel="comingSoon" hidden></section>
          <section class="admin-panel" data-panel="parts" hidden></section>
          <section class="admin-panel" data-panel="manuals" hidden></section>
          <section class="admin-panel" data-panel="locations" hidden></section>
          <section class="admin-panel" data-panel="blogs" hidden></section>
          <section class="admin-panel" data-panel="faq" hidden></section>
          <section class="admin-panel" data-panel="security" hidden></section>
          <section class="admin-panel" data-panel="launch" hidden></section>
        </div>
      </section>
    </main>

    <script src="theme.js?v=20261005-security-10"></script>
    <script src="assets/vendor/purify-3.4.16.min.js"></script>
    <script src="api-client.js?v=20261005-security-12"></script>
    <script src="cms-focus.js?v=20261005-security-11"></script>
    <script src="admin.js?v=20261005-security-12"></script>
  </body>
</html>
